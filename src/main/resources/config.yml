# GhostTab Configuration

# How long (in hours) offline players should remain visible in the tab list
offline-window-hours: 24

# How often (in seconds) the tab list times should refresh
update-interval-seconds: 30

# Rolling window (in hours) used for the total playtime shown in the footer
playtime-window-hours: 12

# Tab list header (supports MiniMessage / Adventure formatting)
# Placeholders: {online} {ghosts} {total_hours} {playtime_window}
header: "<gold><bold>A Zombie Pigman Broke My Door</bold></gold>"

# Tab list footer
# Placeholders: {online} {ghosts} {total_hours} {playtime_window}
footer: "<gray>Players have played a total of <white>{total_hours}</white> hours in the last {playtime_window} hours</gray>"

# Display format for online players: {name} and {time}
online-format: "<white>{name} <gray>{time}</gray>"

# Display format for offline/ghost players: {name} and {time}
offline-format: "<dark_gray>{name} <gray>offline {time}</gray>"

# Seed lifetime playtime from vanilla/Paper stats files on startup.
# Point each entry at a world's stats folder, or at the world folder itself
# (the plugin will look for a stats/ subdirectory).
stats-directories: []

# If true, re-scan stats files every startup and keep the higher of
# stored lifetime seconds vs the player file (never decreases).
import-stats-on-startup: true

# Write a GhostTab-matching snapshot to plugins/ghosttab/status.json
export-json: true

# Optional outbound POST of that same JSON (Cloudflare Worker later).
# Leave empty to stay local-only. No inbound port is opened.
push-url: ""
push-token: ""
