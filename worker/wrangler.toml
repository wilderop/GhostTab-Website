name = "ghosttab-status"
main = "src/index.js"
compatibility_date = "2026-08-18"

# After you create the KV namespace, paste the id here:
#   npx wrangler kv namespace create STATUS
[[kv_namespaces]]
binding = "STATUS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Set the write secret after deploy:
#   npx wrangler secret put PUSH_TOKEN
